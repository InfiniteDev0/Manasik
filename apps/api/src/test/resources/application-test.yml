# Test profile. Connection details come from @DynamicPropertySource, which has
# higher precedence than anything here or in application.yml.
spring:
  jpa:
    hibernate:
      # Flyway still owns the schema in tests — the migrations are part of what
      # is under test. `create-drop` would skip them entirely and test a schema
      # Hibernate invented, including none of the RLS policies.
      ddl-auto: validate

logging:
  level:
    com.manasik.api: DEBUG
    org.testcontainers: INFO
    # Quieten the container's own startup chatter.
    tc: WARN
