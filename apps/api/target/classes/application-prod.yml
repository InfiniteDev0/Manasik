server:
  # Don't advertise the server implementation in response headers.
  server-header:
  forward-headers-strategy: framework

manasik:
  cookie:
    # HTTPS-only refresh cookie in production. Left false in dev so the cookie
    # still works over http://localhost.
    secure: true

springdoc:
  swagger-ui:
    # Interactive API explorer stays off in production. The spec itself is also
    # disabled below — turn `api-docs` back on only if you need it for tooling.
    enabled: false
  api-docs:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.manasik.api: INFO
    org.springframework.security: WARN
